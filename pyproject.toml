[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tgpawb_world_model"
version = "0.1.0"
description = "Task-grounded predictive attention bottleneck skeleton for efficient world models."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch",
  "numpy",
  "pyyaml",
  "tqdm",
  "matplotlib",
  "pytest",
]

[tool.setuptools]
packages = ["data", "encoders", "models", "training", "eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

