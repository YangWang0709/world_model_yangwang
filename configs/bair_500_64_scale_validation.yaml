  hidden_dim: 256
  dropout: 0.0
  use_task: false
  batch_size: 4
  max_steps: 800
  learning_rate: 0.001
  weight_decay: 0.0001
  num_workers: 0
  topk: 16

student_world_model:
  run_name: student_world_model_bair_videomae_500_64_weighted_mse_v1
