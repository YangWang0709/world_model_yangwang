stage: bridgedata_v2_tfds_true_temporal_step33a
project_root: /home/ubuntu22/tgpawb_world_model
seed: 42

input:
  tfds_dataset_root: /home/ubuntu22/tgpawb_world_model/data/bridgedata_v2_tfds_mini/bridge_dataset/1.0.0
  tfds_env_python: /home/ubuntu22/miniconda3/envs/tgpawb_tfds_py311/bin/python
  resolved_fields_json: /home/ubuntu22/tgpawb_world_model/runs/bridgedata_v2_tfds_field_resolver_step23_5_v1/resolved_fields.json
  local_videomae_model: /home/ubuntu22/tgpawb_world_model/model_cache/videomae-base-finetuned-kinetics-local

  step32_run_dir: /home/ubuntu22/tgpawb_world_model/runs/bridgedata_v2_tfds_longer_horizon_step32_v1
  step32_horizon_window_manifest_jsonl: /home/ubuntu22/tgpawb_world_model/runs/bridgedata_v2_tfds_longer_horizon_step32_v1/horizon_window_manifest.jsonl
  step32_horizon_splits_json: /home/ubuntu22/tgpawb_world_model/runs/bridgedata_v2_tfds_longer_horizon_step32_v1/horizon_splits.json
  step32_clip_export_summary_json: /home/ubuntu22/tgpawb_world_model/runs/bridgedata_v2_tfds_longer_horizon_step32_v1/clip_export_summary.json
  step32_frame_repeat_token_manifest_jsonl: /home/ubuntu22/tgpawb_world_model/runs/bridgedata_v2_tfds_longer_horizon_step32_v1/token_manifest.jsonl
  step32_frame_repeat_token_summary_json: /home/ubuntu22/tgpawb_world_model/runs/bridgedata_v2_tfds_longer_horizon_step32_v1/token_summary.json
  step32_horizon_target_summary_json: /home/ubuntu22/tgpawb_world_model/runs/bridgedata_v2_tfds_longer_horizon_step32_v1/horizon_target_summary.json
  step32_decision_json: /home/ubuntu22/tgpawb_world_model/runs/bridgedata_v2_tfds_longer_horizon_step32_v1/step32_decision.json

selection:
  horizon_gap: 0
  target_variant_primary: future_delta_last_minus_current
  target_variants:
    - future_delta_last_minus_current
    - future_delta_mean_minus_current
    - future_mean_all4
  selected_windows_source: step32_gap0
  max_windows: 64
  split_seeds: [42, 123, 999]
  train_ratio: 0.75
  reuse_step32_splits: true

true_temporal_token_extraction:
  enabled: true
  limited_token_extraction_only: true
  no_model_download: true
  local_files_only: true
  use_existing_clip_cache_if_available: true
  allow_limited_clip_export_from_existing_shard_if_missing: true
  tokenization_mode: true_temporal_clip
  context_clip_len: 16
  current_clip_len: 4
  future_clip_len: 4
  video_mae_expected_input_frames: 16
  current_future_padding_mode: deterministic_repeat_to_required_length
  preserve_frame_order: true
  image_size: 224
  batch_size: 1
  device: cuda_if_available
  allow_cpu_fallback: true
  save_raw_images: false
  save_video: false

token_schema:
  shape_flexible: true
  token_dim: 768
  require_context_summary: true
  require_current_summary: true
  require_future_summary: true
  require_delta_targets: true
  allow_flat_clip_tokens: true
  do_not_force_frame_repeat_shape: true

proxy_importance:
  enabled: true
  limited_proxy_importance_generation_only: true
  method: proxy_token_mse_dryrun_true_temporal
  target: context_tokens_only
  current_tokens_kept_full: true
  train_current_importance: false
  topk: 256
  normalize_per_sample: true

comparison:
  representation_modes:
    - frame_repeat_baseline_step32
    - true_temporal_clip_step33a
  policies:
    - current_only
    - random_context_topk
    - proxy_importance_topk
    - full_context_reference
  primary_target: future_delta_last_minus_current
  target_variants:
    - future_delta_last_minus_current
    - future_delta_mean_minus_current
    - future_mean_all4
  split_seeds: [42, 123, 999]
  topk: 256

policies:
  - name: current_only
    use_context: false
    topk: 0
    train: true
  - name: random_context_topk
    use_context: true
    selection: random
    topk: 256
    seed: 42
    train: true
  - name: proxy_importance_topk
    use_context: true
    selection: importance_topk
    topk: 256
    train: true
  - name: full_context_reference
    use_context: true
    selection: full
    topk: null
    deployable: false
    train: true

tiny_trainval:
  enabled: true
  train_separate_model_per_policy: true
  model_type: shape_flexible_context_bottleneck_predictor
  hidden_dim: 256
  loss: mse_to_target_summary
  optimizer: adamw
  learning_rate: 0.001
  weight_decay: 0.0
  train_steps: 400
  eval_every: 50
  grad_clip_norm: 1.0
  device: cuda_if_available
  allow_cpu_fallback: true
  save_checkpoint: false
  save_state_dict: false
  tiny_result_not_final_performance: true

decision:
  context_utility_claim_allowed: false
  selector_training_allowed: false
  current_importance_training_allowed: false
  true_temporal_positive_requires:
    true_temporal_proxy_beats_current_fraction_min: 0.67
    true_temporal_proxy_beats_random_fraction_min: 0.67
    true_temporal_gain_over_frame_repeat_min: 0.05
  next_step_options:
    - scale_true_temporal_gap0_delta_target
    - add_data_diversity_second_tfds_shard
    - train_proxy_supervised_selector_not_yet
    - improve_representation_or_teacher
  require_clear_step33b_or_step34_recommendation: true

guards:
  no_new_data_download: true
  no_new_tfds_shard_download: true
  no_raw_zip_download: true
  no_full_tfds_download: true
  no_droid_download: true
  no_model_download: true
  allow_limited_clip_export_from_existing_shard: true
  allow_limited_true_temporal_token_extraction_from_existing_shard: true
  allow_limited_proxy_importance_generation: true
  allow_tiny_diagnostic_predictor_training: true
  no_videomae_training: true
  no_context_teacher_large_training: true
  no_selector_training: true
  no_current_importance_training: true
  no_action_input: true
  no_vlm: true
  no_rl: true
  no_large_token_shards: true
  no_large_importance_shards: true
  no_write_data_token_shards: true
  no_write_data_importance_shards: true
  keep_tensorflow_out_of_env_isaaclab: true

output:
