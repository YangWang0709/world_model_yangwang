selection:
  topk: 16
  policies:
    - random_k
    - uniform_k
    - teacher_importance_topk
    - learned_selector

compressor:
  token_dim: 768
  latent_dim: 512
  hidden_dim: 512
  num_latents: 16
  dropout: 0.0
  compressor_type: perceiver_like
  num_heads: 8

student_world_model:
  latent_dim: 512
  hidden_dim: 512
  output_dim: 768
  num_layers: 2
  dropout: 0.0
  pool: mean

training:
  device: cuda_if_available
  batch_size: 4
  max_steps: 1200
  learning_rate: 0.001
  weight_decay: 0.0001
  num_workers: 0
  log_every: 100
  checkpoint_every: 1200
  max_grad_norm: 1.0
  future_loss_weight: 1.0
  repeat_random_seeds:
    random_k: [0, 1, 2]
    uniform_k: [0]
    teacher_importance_topk: [0]
    learned_selector: [0, 1, 2]

resource_limits:
  max_ram_gb_warning: 28
  max_gpu_mem_fraction_warning: 0.9
  cloud_recommendation_on_oom: true

output:
