  token_shapes:
    context: [16, 392, 768]
    current: [4, 392, 768]
    future: [4, 392, 768]
    importance: [16, 392]

diagnostics:
  run_teacher_architecture_ablation: true
  run_label_score_ablation: true
  run_temporal_horizon_diagnosis: true
  run_current_dominance_diagnosis: true
  run_failure_analysis: true

teacher_architecture_ablation:
  enabled: true
  split_seeds: [42, 123, 999]
  train_steps: 160
  eval_every: 40
  optimizer: adamw
  learning_rate: 0.001
  hidden_dim: 256
  topk: 256
  save_checkpoint: false
  variants:
    - current_only_predictor
    - current_plus_mean_context_predictor
    - current_plus_proxy_topk_context_predictor
    - current_conditioned_attention_predictor
    - current_conditioned_attention_with_proxy_prior
    - temporal_frame_attention_predictor

label_score_ablation:
  enabled: true
  topk: 256
  split_seeds: [42, 123, 999]
  compare_scores:
    - proxy_importance
    - teacher_occlusion_delta
    - teacher_attention_weight
    - gradient_saliency
    - attention_times_gradient
    - random_context
    - full_context
  train_steps: 160
  context_utility_claim_allowed: false

temporal_horizon_diagnosis:
  enabled: true
  use_existing_tokens_only: true
  no_true_temporal_token_extraction: true
  target_variants:
    - future_mean_all4
    - future_first
    - future_last
    - future_delta_last_minus_current
  compare_policies:
    - current_only
    - proxy_importance_topk
    - full_context_reference
  train_steps: 160
  eval_every: 40
  split_seeds: [42, 123, 999]
  hidden_dim: 256
  learning_rate: 0.001
  topk: 256

current_dominance_diagnosis:
  enabled: true
  train_current_importance_now: false

decision:
  context_utility_claim_allowed: false
  selector_training_allowed: false
  current_importance_training_allowed: false
  require_clear_recommendation: true

