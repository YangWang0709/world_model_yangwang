  token_summary_json: /home/ubuntu22/tgpawb_world_model/runs/bridgedata_v2_tfds_data_diversity_step33b_v1/token_summary.json
  importance_manifest_jsonl: /home/ubuntu22/tgpawb_world_model/runs/bridgedata_v2_tfds_data_diversity_step33b_v1/importance_manifest.jsonl
  importance_summary_json: /home/ubuntu22/tgpawb_world_model/runs/bridgedata_v2_tfds_data_diversity_step33b_v1/importance_summary.json
  shard_splits_json: /home/ubuntu22/tgpawb_world_model/runs/bridgedata_v2_tfds_data_diversity_step33b_v1/shard_splits.json
  step34_plan_summary_json: /home/ubuntu22/tgpawb_world_model/runs/bridgedata_v2_tfds_proxy_temporal_selector_step34_v1/step34_selector_plan_summary.json
  step34_eval_json: /home/ubuntu22/tgpawb_world_model/runs/bridgedata_v2_tfds_proxy_temporal_selector_step34_v1/step34_eval.json
  shard0_token_manifest_jsonl: /home/ubuntu22/tgpawb_world_model/runs/bridgedata_v2_tfds_longer_horizon_step32_v1/token_manifest.jsonl
  shard0_token_summary_json: /home/ubuntu22/tgpawb_world_model/runs/bridgedata_v2_tfds_longer_horizon_step32_v1/token_summary.json
  shard0_importance_manifest_jsonl: /home/ubuntu22/tgpawb_world_model/runs/bridgedata_v2_tfds_longer_horizon_step32_v1/importance_manifest.jsonl
  shard0_importance_summary_json: /home/ubuntu22/tgpawb_world_model/runs/bridgedata_v2_tfds_longer_horizon_step32_v1/importance_summary.json
  shard0_horizon_window_manifest_jsonl: /home/ubuntu22/tgpawb_world_model/runs/bridgedata_v2_tfds_longer_horizon_step32_v1/horizon_window_manifest.jsonl
  shard0_horizon_splits_json: /home/ubuntu22/tgpawb_world_model/runs/bridgedata_v2_tfds_longer_horizon_step32_v1/horizon_splits.json

data:
  context_token_shape: [16, 392, 768]
  current_token_shape: [4, 392, 768]
  importance_shape: [16, 392]
  proxy_temporal_target_shape: [16]
  use_action_as_input: false
  use_language_as_input: false
  action_language_metadata_only: true
  load_future_tokens_for_selector: false
  max_samples_per_shard: 64

selector:
  module: ProxyTemporalSelectorHead
  temporal_only: true
  patch_level_selector: false
  final_selector: false
  token_dim: 768
  hidden_dim: 128
  context_frames: 16
  spatial_tokens: 392
  condition_on_current_summary: true
  dropout: 0.0
  detach_token_inputs: true
  freeze_videomae: true
  train_video_encoder: false
  train_current_importance: false

training:
  enabled: true
  bounded_smoke_training_only: true
  optimizer: adamw
  learning_rate: 0.001
  weight_decay: 0.0
  train_steps: 300
  eval_every: 25
  batch_size: 8
  grad_clip_norm: 1.0
  device: cuda_if_available
  allow_cpu_fallback: true
  save_checkpoint: false
  save_state_dict: false
  allowed_optimizer_scopes:
    - proxy_temporal_selector_head_only

loss:
  mse_weight: 1.0
  rank_weight: 0.1
  topk_soft_weight: 0.1
  topk_frames: [1, 2, 4]

splits:
  split_seeds: [42, 123, 999]
  strict_shard_aware_splits: true
  run_within_shard: true
  run_cross_shard: true
  run_mixed_shard: true
  sample_id_disjoint: true
  trajectory_disjoint_if_possible: true
  no_language_leakage: true
  language_hash_non_comparable_is_not_shift: true

metrics:
  compute_mse: true
  compute_pearson: true
  compute_spearman: true
  compute_topk_frame_overlap: true
  compute_random_baseline: true
  compute_current_only_baseline: true
  compute_uniform_baseline: true
  compute_overfit_gap: true

future_gates:
  context_utility_claim_allowed: false
  selector_training_allowed: false
  final_selector_training_allowed: false
  current_importance_training_allowed: false
  future_selector_training_gate_ready_allowed: true
  gate_requirements:
    selector_beats_random_baseline: true
    selector_beats_current_only_baseline: true
    selector_generalizes_cross_shard: true
    no_language_or_trajectory_leakage: true
    no_dataset_bias_or_shard_shift: true
    full_context_noisy_issue_acknowledged: true

guards:
  no_raw_zip_download: true
  no_full_tfds_download: true
  no_droid_download: true
  no_open_x_embodiment_download: true
  no_new_tfds_shard_download: true
  no_new_pretrained_model_download: true
  no_checkpoint_download: true
  no_image_or_video_download: true
  no_compressed_archive_download: true
  no_extra_cloud_resources: true
  no_bair_redownload: true
  no_videomae_token_reextraction: true
  no_proxy_importance_regeneration: true
  use_existing_local_artifacts_only: true
  use_existing_step33b_artifacts_only: true
  use_existing_step34_scaffold: true
  no_tensorflow_import_in_env_isaaclab: true
  no_tensorflow_datasets_import_in_env_isaaclab: true
  no_videomae_training: true
  no_vjepa_training: true
  no_context_teacher_large_training: true
  no_final_selector_training: true
  no_patch_level_selector_training: true
  no_current_importance_training: true
  no_current_frame_select_importance_training: true
  no_world_model_training: true
  no_downstream_task_training: true
  no_action_conditioned_world_model_training: true
  no_vlm: true
  no_rl: true
  no_action_input: true
  no_language_input: true
  action_language_goal_metadata_only: true
  no_write_data_token_shards: true
  no_write_data_importance_shards: true
  no_checkpoint_save: true

output:
  run_root: /home/ubuntu22/tgpawb_world_model/runs
  run_name: bridgedata_v2_tfds_proxy_temporal_selector_train_step35_v1
  run_dir: /home/ubuntu22/tgpawb_world_model/runs/bridgedata_v2_tfds_proxy_temporal_selector_train_step35_v1
  train_summary_json: /home/ubuntu22/tgpawb_world_model/runs/bridgedata_v2_tfds_proxy_temporal_selector_train_step35_v1/train_summary.json
  loss_curves_json: /home/ubuntu22/tgpawb_world_model/runs/bridgedata_v2_tfds_proxy_temporal_selector_train_step35_v1/loss_curves.json
  metrics_json: /home/ubuntu22/tgpawb_world_model/runs/bridgedata_v2_tfds_proxy_temporal_selector_train_step35_v1/selector_metrics.json
  gate_decision_json: /home/ubuntu22/tgpawb_world_model/runs/bridgedata_v2_tfds_proxy_temporal_selector_train_step35_v1/step35_gate_decision.json
  eval_json: /home/ubuntu22/tgpawb_world_model/runs/bridgedata_v2_tfds_proxy_temporal_selector_train_step35_v1/step35_eval.json
  eval_md: /home/ubuntu22/tgpawb_world_model/runs/bridgedata_v2_tfds_proxy_temporal_selector_train_step35_v1/step35_eval.md
