stage: bridgedata_v2_tfds_proxy_temporal_selector_train_step35
project_root: /home/ubuntu22/tgpawb_world_model
seed: 42

input:
  step33b_run_dir: /home/ubuntu22/tgpawb_world_model/runs/bridgedata_v2_tfds_data_diversity_step33b_v1
  step34_run_dir: /home/ubuntu22/tgpawb_world_model/runs/bridgedata_v2_tfds_proxy_temporal_selector_step34_v1
