  batch_size: 4
  max_steps: 300
  learning_rate: 0.001
  weight_decay: 0.0001
  num_workers: 0
  log_every: 25
  checkpoint_every: 300
  max_grad_norm: 1.0

resource_limits:
  max_ram_gb_warning: 28
  max_gpu_mem_fraction_warning: 0.9
  cloud_recommendation_on_oom: true

output:
  run_root: /home/ubuntu22/tgpawb_world_model/runs
  run_name: teacher_bair_videomae_smoke_v1
  save_checkpoint: true
  save_metrics: true
