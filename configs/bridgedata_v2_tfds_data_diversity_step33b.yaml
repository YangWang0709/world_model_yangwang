  step33a_decision_json: /home/ubuntu22/tgpawb_world_model/runs/bridgedata_v2_tfds_true_temporal_step33a_v1/step33a_decision.json

second_shard:
  enabled: true
  allow_one_new_tfds_shard_download: true
  preferred_shard_indices: [1, 2, 3]
  max_new_shards_to_download: 1
  expected_filename_pattern: bridge_dataset-train.tfrecord-{index:05d}-of-01024
  warning_size_mb: 256
  hard_cap_size_mb: 1024
  require_size_check_before_download: true
  safe_stop_if_size_unknown: true
  safe_stop_if_download_fails: true
  no_raw_zip: true
  no_full_tfds: true
  no_droid: true
  no_model_download: true

window:
  context_len: 16
  current_len: 4
  future_len: 4
  horizon_gap: 0
  target_variant: future_delta_last_minus_current
  image_field: steps/observation/image_0
  action_field: steps/action
  language_field: steps/language_instruction
  action_language_goal_as_metadata_only: true

window_selection:
  target_windows_per_shard: 64
  min_windows_per_shard: 32
  prefer_trajectory_diversity: true
  max_windows_per_trajectory_soft_cap: 16
  split_seeds: [42, 123, 999]
  train_ratio: 0.75
  val_ratio: 0.25
  trajectory_disjoint_if_possible: true
  deterministic_seed: 42

sample_limits:
  max_samples: 128
  batch_size: 64
  shuffle: false

dry_run_limits:
  max_windows: 64
  max_trajectories: 64
  max_total_frames: 1536
  batch_size: 1
  save_clip_cache: true
  save_token_smoke_artifact: true
  save_importance_artifacts: true
  max_clip_cache_mb: 4096
  max_token_artifact_mb: 4096
  max_importance_artifact_mb: 1024
  max_samples: 64

resolved_fields:
  image_field: steps/observation/image_0
  action_field: steps/action
  language_field: steps/language_instruction
  goal_field: null

clip_export:
  enabled: true
  limited_clip_export_only: true
  image_size: 224
  output_dtype: uint8
  normalize_in_exporter: false
  export_context: true
  export_current: true
  export_future: true
  export_actions_metadata: true
  export_language_metadata: true
  use_action_as_input: false
  use_language_as_input: false
  use_goal_image_as_input: false

token_extraction:
  enabled: true
  tokenization_mode: frame_repeat_baseline
  limited_token_extraction_only: true
  perform_limited_token_extraction: true
  no_model_download: true
  local_files_only: true
  image_field: steps/observation/image_0
  image_size: 224
  batch_size: 1
  frame_repeat: 4
  tokenize_each_frame_as_repeated_clip: true
  expected_context_shape: [16, 392, 768]
  expected_current_shape: [4, 392, 768]
  expected_future_shape: [4, 392, 768]

videomae:
  use_existing_local_model_only: true
  allow_model_download: false
  local_files_only: true
  model_name_or_path_candidates:
    - /home/ubuntu22/tgpawb_world_model/model_cache/videomae-base-finetuned-kinetics-local
  fallback_if_model_missing: safe_stop
  freeze_model: true
  eval_mode: true
  output_mode: last_hidden_state
  image_size: 224
  frame_repeat: 4
  tokenize_each_frame_as_repeated_clip: true
  device: cuda_if_available

proxy_importance:
  enabled: true
  limited_proxy_importance_generation_only: true
  method: proxy_token_mse_dryrun
  target: context_tokens_only
  current_tokens_kept_full: true
  train_current_importance: false
  output_shape: [16, 392]
  topk: 256

importance:
  perform_limited_proxy_importance: true
  method: proxy_token_mse_dryrun
  target: context_tokens_only
  current_tokens_kept_full: true
  train_current_importance: false
  output_shape: [16, 392]
  label_quality_note: proxy dry-run only; not final teacher label

proxy_teacher:
  enabled: true
  name: deterministic_token_space_proxy
  no_trainable_parameters: true
  prediction_target: future_token_summary
  base_prediction:
    use_current_mean: true
    use_context_mean: true
    context_weight: 0.25
    current_weight: 0.75

evaluation:
  policies:
    - current_only
    - random_context_topk
    - proxy_importance_topk
    - full_context_reference
  target_variant: future_delta_last_minus_current
  topk: 256
  split_seeds: [42, 123, 999]
  run_within_shard_eval: true
  run_cross_shard_eval: true
  run_mixed_shard_eval: true
  allow_cross_shard_safe_skip_if_shard0_tokens_unavailable: true

policies:
  - name: current_only
    use_context: false
    topk: 0
    train: true
  - name: random_context_topk
    use_context: true
    selection: random
    topk: 256
    seed: 42
    train: true
  - name: proxy_importance_topk
    use_context: true
    selection: importance_topk
    topk: 256
    train: true
  - name: full_context_reference
    use_context: true
    selection: full
    topk: null
    deployable: false
    train: true

tiny_trainval:
  enabled: true
  train_separate_model_per_policy: true
  model_type: smoke_context_bottleneck_predictor
  hidden_dim: 256
  loss: mse_to_target_summary
  optimizer: adamw
  learning_rate: 0.001
  weight_decay: 0.0
  train_steps: 400
  eval_every: 50
  grad_clip_norm: 1.0
  device: cuda_if_available
  allow_cpu_fallback: true
  save_checkpoint: false
  save_state_dict: false
  tiny_result_not_final_performance: true

dataset_bias_diagnosis:
  enabled: true
  compare_episode_length_distribution: true
  compare_action_distribution_if_available: true
  compare_language_instruction_hashes: true
  compare_window_count_per_trajectory: true
  compare_proxy_label_stats: true
  compare_topk_mass: true
  compare_temporal_importance_distribution: true
  raw_language_preview_limit: 0

decision:
  context_utility_claim_allowed: false
  selector_training_allowed: false
  current_importance_training_allowed: false
  stable_cross_shard_signal_requires:
    proxy_beats_current_fraction_min: 0.67
    proxy_beats_random_fraction_min: 0.67
    cross_shard_proxy_gain_positive: true
  next_step_options:
    - prepare_proxy_supervised_selector_after_cross_shard_validation
    - add_more_tfds_shards_before_selector
    - diagnose_dataset_bias
    - improve_representation_or_task_target_before_selector
  require_clear_step34_recommendation: true

guards:
  allow_one_new_tfds_shard_download: true
  max_new_shards_to_download: 1
  no_raw_zip_download: true
  no_full_tfds_download: true
  no_droid_download: true
  no_model_download: true
  allow_limited_clip_export_from_existing_or_one_new_shard: true
  allow_limited_token_extraction_from_existing_or_one_new_shard: true
  allow_limited_proxy_importance_generation: true
  allow_tiny_diagnostic_predictor_training: true
  no_videomae_training: true
  no_context_teacher_large_training: true
  no_selector_training: true
  no_current_importance_training: true
  no_action_input: true
  no_vlm: true
  no_rl: true
  no_large_token_shards: true
  no_large_importance_shards: true
  no_write_data_token_shards: true
  no_write_data_importance_shards: true
  keep_tensorflow_out_of_env_isaaclab: true

