stage: selector_ablation_bair_videomae_smoke
project_root: /home/ubuntu22/tgpawb_world_model
seed: 42

data:
  dataset: BAIR
  train_token_shard_dir: /home/ubuntu22/tgpawb_world_model/data/token_shards/bair_videomae_smoke/train
  test_token_shard_dir: /home/ubuntu22/tgpawb_world_model/data/token_shards/bair_videomae_smoke/test
  train_importance_shard_dir: /home/ubuntu22/tgpawb_world_model/data/importance_shards/bair_videomae_teacher_smoke/train
  test_importance_shard_dir: /home/ubuntu22/tgpawb_world_model/data/importance_shards/bair_videomae_teacher_smoke/test
  token_shard_glob: tokens_shard_*.pt
  importance_shard_glob: importance_shard_*.pt
  split_train: train
  split_test: test
  require_key_token_mask: false
  max_train_samples: 100
  max_test_samples: 16

selector_model:
  token_dim: 768
  hidden_dim: 256
  dropout: 0.0
  use_task: false

selection:
  topk: 16
  use_sigmoid_scores: true

selector_training:
  device: cuda_if_available
  batch_size: 4
  max_steps: 300
  learning_rate: 0.001
  weight_decay: 0.0001
  num_workers: 0
  log_every: 100
  checkpoint_every: 300
  max_grad_norm: 1.0

loss_variants:
  - name: mse_only
    type: mse_only
    seed: 0
    topk: 16

  - name: weighted_mse_alpha2
    type: weighted_mse
    seed: 0
    alpha: 2.0
    topk: 16

  - name: mse_rank_w0p1
    type: mse_plus_pairwise_rank
    seed: 0
    rank_loss_weight: 0.1
    num_pairs: 64
    temperature: 1.0
    topk: 16

  - name: topk_bce
    type: topk_bce
    seed: 0
    bce_loss_weight: 1.0
    topk: 16

  - name: hybrid_weighted_mse_rank_bce
    type: hybrid_weighted_mse_rank_bce
    seed: 0
    weighted_mse_alpha: 2.0
    weighted_mse_loss_weight: 1.0
    rank_loss_weight: 0.1
    bce_loss_weight: 0.2
    num_pairs: 64
    temperature: 1.0
    topk: 16

downstream_student_world_model:
  enabled: true
  device: cuda_if_available
  max_steps: 500
  batch_size: 4
  learning_rate: 0.001
  weight_decay: 0.0001
  num_workers: 0
  log_every: 100
  checkpoint_every: 500
  max_grad_norm: 1.0

compressor:
  token_dim: 768
  latent_dim: 512
  hidden_dim: 512
  num_latents: 16
  dropout: 0.0
  compressor_type: perceiver_like
  num_heads: 8

student_world_model:
  latent_dim: 512
  hidden_dim: 512
  output_dim: 768
  num_layers: 2
  dropout: 0.0
  pool: mean

teacher_reference:
  checkpoint: /home/ubuntu22/tgpawb_world_model/runs/teacher_bair_videomae_smoke_v1/checkpoints/teacher_world_model_step_000300.pt
  token_dim: 768
  hidden_dim: 512
  output_dim: 768
  num_layers: 2
  dropout: 0.0
  pool: mean

step12_reference:
  baseline_summary_json: /home/ubuntu22/tgpawb_world_model/runs/baseline_comparison_bair_videomae_smoke_v1/baseline_summary.json

resource_limits:
  max_ram_gb_warning: 28
  max_gpu_mem_fraction_warning: 0.9
  cloud_recommendation_on_oom: true

output:
  run_root: /home/ubuntu22/tgpawb_world_model/runs
  run_name: selector_ablation_bair_videomae_smoke_v1
  save_checkpoint: true
  save_metrics: true
