stage: bridgedata_v2_tfds_importance_step25
project_root: /home/ubuntu22/tgpawb_world_model
seed: 42

input:
  step24_run_dir: /home/ubuntu22/tgpawb_world_model/runs/bridgedata_v2_tfds_token_extraction_step24_v1
  token_manifest_jsonl: /home/ubuntu22/tgpawb_world_model/runs/bridgedata_v2_tfds_token_extraction_step24_v1/tfds_token_smoke_manifest.jsonl
  token_summary_json: /home/ubuntu22/tgpawb_world_model/runs/bridgedata_v2_tfds_token_extraction_step24_v1/tfds_token_extraction_summary.json
  token_smoke_dir: /home/ubuntu22/tgpawb_world_model/runs/bridgedata_v2_tfds_token_extraction_step24_v1/token_smoke

dry_run_limits:
  max_samples: 4
  max_context_frames: 16
  max_context_tokens_per_frame: 392
  max_total_context_tokens_per_sample: 6272
  batch_size: 1
  save_importance_artifacts: true
  max_importance_artifact_mb: 256

token_shapes:
  context: [16, 392, 768]
  current: [4, 392, 768]
  future: [4, 392, 768]

importance:
  target: context_tokens_only
  current_tokens_kept_full: true
  train_current_importance: false
  method: proxy_token_mse_dryrun
  label_normalization: minmax_per_sample
  output_shape: [16, 392]
  temporal_aggregation: true
  spatial_aggregation: true

proxy_teacher:
  enabled: true
  name: deterministic_token_space_proxy
  no_trainable_parameters: true
  prediction_target: future_token_summary
  base_prediction:
    use_current_mean: true
    use_context_mean: true
    context_weight: 0.25
    current_weight: 0.75
  occlusion:
    mode: zero_context_token
    compute_delta_loss: true
    loss: mse_to_future_summary
  notes: proxy is for pipeline smoke only, not final scientific label

optional_existing_teacher:
  enabled: false
  use_only_if_local_checkpoint_exists: true
  allow_download: false
  train_if_missing: false

guards:
  no_download: true
  no_new_data_download: true
  no_new_tfds_shard_download: true
  no_model_download: true
  no_training: true
  no_teacher_training: true
  no_selector_training: true
  no_world_model_training: true
  no_token_extraction: true
  no_large_importance_shards: true
  no_write_data_importance_shards: true
  no_write_data_token_shards: true
  no_current_importance: true
  no_action_input: true
  no_vlm: true
  no_rl: true
  keep_tensorflow_out_of_env_isaaclab: true

output:
  run_root: /home/ubuntu22/tgpawb_world_model/runs
  run_name: bridgedata_v2_tfds_importance_step25_v1
  importance_dir: /home/ubuntu22/tgpawb_world_model/runs/bridgedata_v2_tfds_importance_step25_v1/importance_smoke
  importance_manifest_jsonl: /home/ubuntu22/tgpawb_world_model/runs/bridgedata_v2_tfds_importance_step25_v1/tfds_importance_smoke_manifest.jsonl
  importance_summary_json: /home/ubuntu22/tgpawb_world_model/runs/bridgedata_v2_tfds_importance_step25_v1/tfds_importance_summary.json
  importance_summary_md: /home/ubuntu22/tgpawb_world_model/runs/bridgedata_v2_tfds_importance_step25_v1/tfds_importance_summary.md
  eval_json: /home/ubuntu22/tgpawb_world_model/runs/bridgedata_v2_tfds_importance_step25_v1/tfds_importance_eval.json
  eval_md: /home/ubuntu22/tgpawb_world_model/runs/bridgedata_v2_tfds_importance_step25_v1/tfds_importance_eval.md
