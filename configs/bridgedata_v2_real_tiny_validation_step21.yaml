stage: bridgedata_v2_real_tiny_validation_step21
project_root: /home/ubuntu22/tgpawb_world_model
seed: 42

dataset:
  name: BridgeData V2
  official_sources_only: true
  full_download_allowed: false
  large_download_allowed: false
  max_download_gb: 1.0
  max_download_bytes: 1073741824
  require_content_length_before_download: true
  delete_partial_if_exceeds_limit: true

  official_sources:
    - name: BridgeData V2 official project page
      url: https://rail-berkeley.github.io/bridgedata/
      kind: official_page
    - name: BridgeData V2 official code repo
      url: https://github.com/rail-berkeley/bridge_data_v2
      kind: official_code_repo

  download_root: /home/ubuntu22/tgpawb_world_model/data/bridgedata_v2_real_tiny_downloads
  extract_root: /home/ubuntu22/tgpawb_world_model/data/bridgedata_v2_real_tiny_extracted
  subset_root: /home/ubuntu22/tgpawb_world_model/data/bridgedata_v2_real_tiny_subset

  allowed_download_kinds:
    - official_metadata
    - official_tiny_sample
    - official_single_small_zip
    - official_demo_subset_if_size_known

  forbidden_download_kinds:
    - full_dataset
    - full_teleop_zip
    - full_scripted_zip
    - unknown_size_file
    - third_party_mirror
    - droid
    - open_x_embodiment

  target_limits:
    max_trajectories: 10
    preferred_trajectories: 5
    min_valid_trajectories: 1
    max_files_to_extract: 2000
    max_images_to_validate: 20

download_probe:
  enabled: true
  use_head_request: true
  use_range_request_only_if_safe: true
  timeout_sec: 30
  follow_redirects: true
  fail_if_size_unknown: true
  no_download_if_probe_fails: true

acquisition:
  enabled: true
  user_approved_tiny_download: true
  dry_run_first: true
  perform_download_only_if_safe: true
  max_download_gb: 1.0

window:
  context_len: 16
  current_len: 4
  future_len: 4
  stride: 1
  frame_rate_subsample: 1
  min_trajectory_len: 24
  image_size: 224

metadata_policy:
  save_action_as_metadata: true
  use_action_as_input: false
  save_language_instruction_as_metadata: true
  use_language_as_input: false
  save_goal_image_as_metadata: true
  use_goal_image_as_input: false
  save_camera_names_as_metadata: true

guards:
  no_training: true
  no_model_download: true
  no_full_dataset_download: true
  no_droid_download: true
  no_token_extraction: true
  no_importance_generation: true
  no_action_input: true
  no_vlm: true
  no_rl: true
  no_step17_rerun: true
  no_step18_rerun: true
  no_step20_rerun_except_builder_reuse: true

resource_limits:
  min_free_disk_gb: 120
  max_download_gb: 1.0

output:
  run_root: /home/ubuntu22/tgpawb_world_model/runs
  run_name: bridgedata_v2_real_tiny_validation_step21_v1

  probe_summary_json: /home/ubuntu22/tgpawb_world_model/runs/bridgedata_v2_real_tiny_validation_step21_v1/download_probe_summary.json
  acquisition_summary_json: /home/ubuntu22/tgpawb_world_model/runs/bridgedata_v2_real_tiny_validation_step21_v1/acquisition_summary.json
  real_manifest_jsonl: /home/ubuntu22/tgpawb_world_model/runs/bridgedata_v2_real_tiny_validation_step21_v1/real_tiny_manifest.jsonl
  real_window_manifest_jsonl: /home/ubuntu22/tgpawb_world_model/runs/bridgedata_v2_real_tiny_validation_step21_v1/real_tiny_window_manifest.jsonl
  validation_summary_json: /home/ubuntu22/tgpawb_world_model/runs/bridgedata_v2_real_tiny_validation_step21_v1/real_tiny_validation_summary.json
  validation_summary_md: /home/ubuntu22/tgpawb_world_model/runs/bridgedata_v2_real_tiny_validation_step21_v1/real_tiny_validation_summary.md
