  step35_run_dir: /home/ubuntu22/tgpawb_world_model/runs/bridgedata_v2_tfds_proxy_temporal_selector_train_step35_v1
  step36_run_dir: /home/ubuntu22/tgpawb_world_model/runs/bridgedata_v2_tfds_proxy_patch_selector_train_step36_v1
  token_manifest_jsonl: /home/ubuntu22/tgpawb_world_model/runs/bridgedata_v2_tfds_data_diversity_step33b_v1/token_manifest.jsonl
  token_summary_json: /home/ubuntu22/tgpawb_world_model/runs/bridgedata_v2_tfds_data_diversity_step33b_v1/token_summary.json
  importance_manifest_jsonl: /home/ubuntu22/tgpawb_world_model/runs/bridgedata_v2_tfds_data_diversity_step33b_v1/importance_manifest.jsonl
  importance_summary_json: /home/ubuntu22/tgpawb_world_model/runs/bridgedata_v2_tfds_data_diversity_step33b_v1/importance_summary.json
  shard_splits_json: /home/ubuntu22/tgpawb_world_model/runs/bridgedata_v2_tfds_data_diversity_step33b_v1/shard_splits.json
  step35_selector_metrics_json: /home/ubuntu22/tgpawb_world_model/runs/bridgedata_v2_tfds_proxy_temporal_selector_train_step35_v1/selector_metrics.json
  step35_gate_decision_json: /home/ubuntu22/tgpawb_world_model/runs/bridgedata_v2_tfds_proxy_temporal_selector_train_step35_v1/step35_gate_decision.json
  step36_patch_selector_metrics_json: /home/ubuntu22/tgpawb_world_model/runs/bridgedata_v2_tfds_proxy_patch_selector_train_step36_v1/patch_selector_metrics.json
  step36_gate_decision_json: /home/ubuntu22/tgpawb_world_model/runs/bridgedata_v2_tfds_proxy_patch_selector_train_step36_v1/step36_gate_decision.json
  step36_eval_json: /home/ubuntu22/tgpawb_world_model/runs/bridgedata_v2_tfds_proxy_patch_selector_train_step36_v1/step36_eval.json
  shard0_token_manifest_jsonl: /home/ubuntu22/tgpawb_world_model/runs/bridgedata_v2_tfds_longer_horizon_step32_v1/token_manifest.jsonl
  shard0_token_summary_json: /home/ubuntu22/tgpawb_world_model/runs/bridgedata_v2_tfds_longer_horizon_step32_v1/token_summary.json
  shard0_importance_manifest_jsonl: /home/ubuntu22/tgpawb_world_model/runs/bridgedata_v2_tfds_longer_horizon_step32_v1/importance_manifest.jsonl
  shard0_importance_summary_json: /home/ubuntu22/tgpawb_world_model/runs/bridgedata_v2_tfds_longer_horizon_step32_v1/importance_summary.json
  shard0_horizon_window_manifest_jsonl: /home/ubuntu22/tgpawb_world_model/runs/bridgedata_v2_tfds_longer_horizon_step32_v1/horizon_window_manifest.jsonl
  shard0_horizon_splits_json: /home/ubuntu22/tgpawb_world_model/runs/bridgedata_v2_tfds_longer_horizon_step32_v1/horizon_splits.json

data:
  context_token_shape: [16, 392, 768]
  current_token_shape: [4, 392, 768]
  importance_shape: [16, 392]
  use_action_as_input: false
  use_language_as_input: false
  load_future_tokens_for_selector: false
  action_language_metadata_only: true
  max_samples_per_shard: 64

selector_variants:
  run_variants:
    - temporal_broadcast_baseline
    - direct_patch_selector_step36_reference
    - factorized_temporal_spatial_selector
    - factorized_temporal_spatial_with_proxy_temporal_prior
    - spatial_residual_selector
  default_variant: factorized_temporal_spatial_selector
  primary_trained_variant: factorized_temporal_spatial_with_proxy_temporal_prior
  loss_ablation_setting_limit: 1

factorized_selector:
  token_dim: 768
  hidden_dim: 128
  context_frames: 16
  spatial_tokens: 392
  condition_on_current_summary: true
  use_temporal_embedding: true
  use_spatial_embedding: true
  use_temporal_branch: true
  use_spatial_residual_branch: true
  combine_mode: temporal_plus_spatial_residual
  detach_token_inputs: true
  freeze_videomae: true
  train_video_encoder: false
  train_current_importance: false
  final_selector: false
  proxy_temporal_aux_weight: 0.1

training:
  enabled: true
  bounded_smoke_training_only: true
  optimizer: adamw
  learning_rate: 0.001
  weight_decay: 0.0
  train_steps: 300
  eval_every: 25
  batch_size: 4
  eval_batch_size: 4
  grad_clip_norm: 1.0
  device: cuda_if_available
  allow_cpu_fallback: true
  save_checkpoint: false
  save_state_dict: false
  allowed_optimizer_scopes:
    - proxy_factorized_selector_head_only
    - proxy_selector_ablation_heads_only

loss_ablation:
  enabled: true
  variants:
    - mse_only
    - mse_plus_rank
    - mse_plus_topk_soft
    - mse_plus_rank_plus_topk_soft
    - topk_bce_plus_rank
  default_variant: mse_plus_rank_plus_topk_soft
  rank_pairs_per_batch: 2048
  topk_values: [64, 128, 256, 512]
  primary_topk: 256

splits:
  split_seeds: [42, 123, 999]
  strict_shard_aware_splits: true
  run_within_shard: true
  run_cross_shard: true
  run_mixed_shard: true
  sample_id_disjoint: true
  trajectory_disjoint_if_possible: true
  no_language_leakage: true
  language_hash_non_comparable_is_not_shift: true

metrics:
  compute_mse: true
  compute_pearson: true
  compute_spearman: true
  compute_topk_token_overlap: true
  compute_topk_precision_recall: true
  compute_random_token_baseline: true
  compute_uniform_token_baseline: true
  compute_temporal_broadcast_baseline: true
  compute_current_only_patch_baseline: true
  compute_step36_reference_comparison: true
  compute_overfit_gap: true
  topk_values: [64, 128, 256, 512]
  primary_topk: 256

future_gates:
  context_utility_claim_allowed: false
  selector_training_allowed: false
  final_selector_training_allowed: false
  current_importance_training_allowed: false
  future_factorized_selector_gate_ready_allowed: true
  gate_requirements:
    factorized_selector_beats_random_token_baseline: true
    factorized_selector_beats_uniform_token_baseline: true
    factorized_selector_beats_temporal_broadcast_baseline: true
    factorized_selector_beats_current_only_patch_baseline: true
    factorized_selector_beats_step36_direct_patch_selector: true
    factorized_selector_generalizes_cross_shard: true
    top256_overlap_mean_min: 0.12
    no_language_or_trajectory_leakage: true
    no_dataset_bias_or_shard_shift: true
    full_context_noisy_issue_acknowledged: true

guards:
  no_raw_zip_download: true
  no_full_tfds_download: true
  no_droid_download: true
  no_open_x_embodiment_download: true
  no_new_tfds_shard_download: true
  no_new_pretrained_model_download: true
  no_checkpoint_download: true
  no_image_or_video_download: true
  no_compressed_archive_download: true
  no_extra_cloud_resources: true
  no_bair_redownload: true
  no_videomae_token_reextraction: true
  no_proxy_importance_regeneration: true
  use_existing_local_artifacts_only: true
  use_existing_step33b_artifacts_only: true
  use_existing_step35_temporal_baseline: true
  use_existing_step36_patch_baseline: true
  no_tensorflow_import_in_env_isaaclab: true
  no_tensorflow_datasets_import_in_env_isaaclab: true
  no_videomae_training: true
  no_vjepa_training: true
  no_context_teacher_large_training: true
  no_final_selector_training: true
  no_current_importance_training: true
  no_current_frame_select_importance_training: true
  no_world_model_training: true
  no_downstream_task_training: true
  no_action_conditioned_world_model_training: true
  no_vlm: true
  no_rl: true
  no_action_input: true
  no_language_input: true
  action_language_goal_metadata_only: true
  no_write_data_token_shards: true
  no_write_data_importance_shards: true
  no_checkpoint_save: true

output:
  run_root: /home/ubuntu22/tgpawb_world_model/runs
  run_name: bridgedata_v2_tfds_factorized_selector_step37_v1
  run_dir: /home/ubuntu22/tgpawb_world_model/runs/bridgedata_v2_tfds_factorized_selector_step37_v1
  train_summary_json: /home/ubuntu22/tgpawb_world_model/runs/bridgedata_v2_tfds_factorized_selector_step37_v1/train_summary.json
  loss_curves_json: /home/ubuntu22/tgpawb_world_model/runs/bridgedata_v2_tfds_factorized_selector_step37_v1/loss_curves.json
  metrics_json: /home/ubuntu22/tgpawb_world_model/runs/bridgedata_v2_tfds_factorized_selector_step37_v1/factorized_selector_metrics.json
  loss_ablation_json: /home/ubuntu22/tgpawb_world_model/runs/bridgedata_v2_tfds_factorized_selector_step37_v1/loss_ablation.json
  gate_decision_json: /home/ubuntu22/tgpawb_world_model/runs/bridgedata_v2_tfds_factorized_selector_step37_v1/step37_gate_decision.json
  eval_json: /home/ubuntu22/tgpawb_world_model/runs/bridgedata_v2_tfds_factorized_selector_step37_v1/step37_eval.json
  eval_md: /home/ubuntu22/tgpawb_world_model/runs/bridgedata_v2_tfds_factorized_selector_step37_v1/step37_eval.md
