stage: predictive_importance_dummy
project_root: /home/ubuntu22/tgpawb_world_model
seed: 42

data:
  token_shard_dir: /home/ubuntu22/tgpawb_world_model/data/token_shards/dummy_toy
  shard_glob: tokens_shard_*.pt
  split: toy

teacher:
  checkpoint: /home/ubuntu22/tgpawb_world_model/runs/teacher_dummy_tiny_v1/checkpoints/teacher_world_model_step_000030.pt
  config:
    token_dim: 768
    hidden_dim: 512
