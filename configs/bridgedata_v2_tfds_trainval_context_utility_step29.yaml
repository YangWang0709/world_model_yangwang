window_selection:
  target_num_windows_primary: 32
  target_num_windows_optional: 64
  use_optional_64_if_resources_ok: false
  max_windows_hard_cap: 64
  context_len: 16
  current_len: 4
  future_len: 4
  expected_total_frames: 24
  prefer_diverse_trajectories: true
  prefer_trajectory_disjoint_train_val: true
  deterministic_seed: 42

split:
  split_type: trajectory_group_if_possible
  train_ratio: 0.75
  val_ratio: 0.25
  min_train_windows: 24
  min_val_windows: 8
  no_duplicate_sample_ids_between_train_val: true
  no_identical_window_between_train_val: true

sample_limits:
  max_samples: 32
  batch_size: 32
  shuffle: false

window:
  context_len: 16
  current_len: 4
  future_len: 4
  expected_total_frames: 24

dry_run_limits:
  max_windows: 32
  max_trajectories: 10
  max_total_frames: 768
  batch_size: 1
  save_clip_cache: true
  save_token_smoke_artifact: true
  save_importance_artifacts: true
  max_clip_cache_mb: 2048
  max_token_artifact_mb: 512
  max_importance_artifact_mb: 256
  max_samples: 32

resolved_fields:
  image_field: steps/observation/image_0
  action_field: steps/action
  language_field: steps/language_instruction
  goal_field: null

clip_export:
  image_size: 224
  output_dtype: uint8
  normalize_in_exporter: false
  export_context: true
  export_current: true
  export_future: true
  export_actions_metadata: true
  export_language_metadata: true
  use_action_as_input: false
  use_language_as_input: false
  use_goal_image_as_input: false

token_extraction:
  perform_limited_token_extraction: true
  no_model_download: true
  local_files_only: true
  image_field: steps/observation/image_0
  image_size: 224
  batch_size: 1
  frame_repeat: 4
  tokenize_each_frame_as_repeated_clip: true
  expected_context_shape: [16, 392, 768]
  expected_current_shape: [4, 392, 768]
  expected_future_shape: [4, 392, 768]

videomae:
  use_existing_local_model_only: true
  allow_model_download: false
  local_files_only: true
  model_name_or_path_candidates:
    - /home/ubuntu22/tgpawb_world_model/model_cache/videomae-base-finetuned-kinetics-local
  fallback_if_model_missing: safe_stop
  freeze_model: true
  eval_mode: true
  output_mode: last_hidden_state
  image_size: 224
  frame_repeat: 4
  tokenize_each_frame_as_repeated_clip: true
  device: cuda_if_available

importance:
  perform_limited_proxy_importance: true
  method: proxy_token_mse_dryrun
  target: context_tokens_only
  current_tokens_kept_full: true
  train_current_importance: false
  output_shape: [16, 392]
  label_quality_note: proxy dry-run only; not final teacher label

proxy_teacher:
  enabled: true
  name: deterministic_token_space_proxy
  no_trainable_parameters: true
  prediction_target: future_token_summary
  base_prediction:
    use_current_mean: true
    use_context_mean: true
    context_weight: 0.25
    current_weight: 0.75

context_bottleneck:
  current_tokens_kept_full: true
  train_current_importance: false
  context_tokens_only: true
  topk_values: [256]
  default_topk: 256

policies:
  - name: current_only
    use_context: false
    topk: 0
    train: true
  - name: random_context_topk
    use_context: true
    selection: random
    topk: 256
    seed: 42
    train: true
  - name: proxy_importance_topk
    use_context: true
    selection: importance_topk
    topk: 256
    train: true
  - name: full_context_reference
    use_context: true
    selection: full
    topk: null
    deployable: false
    train: true

tiny_trainval:
  enabled: true
  train_separate_model_per_policy: true
  model_type: smoke_context_bottleneck_predictor
  hidden_dim: 512
  prediction_target: future_token_summary
  loss: mse_to_future_summary
  optimizer: adamw
  learning_rate: 0.001
  weight_decay: 0.0
  train_steps: 500
  eval_every: 25
  grad_clip_norm: 1.0
  device: cuda_if_available
  allow_cpu_fallback: true
  save_checkpoint: false
  save_state_dict: false
  tiny_trainval_result_not_final_performance: true

context_utility_acceptance:
  require_all_losses_finite: true
  require_train_loss_decrease: true
  min_relative_train_loss_decrease: 0.01
  require_val_metrics_finite: true
  context_utility_positive_requires:
    proxy_better_than_current_only_relative: 0.01
    proxy_better_than_random_relative: 0.01
    full_better_than_current_only_relative: 0.01
  allow_inconclusive_result: true
  never_claim_final_utility: true

guards:
  no_new_data_download: true
  no_new_tfds_shard_download: true
  no_raw_zip_download: true
  no_full_tfds_download: true
  no_droid_download: true
  no_model_download: true
  allow_limited_token_extraction_from_existing_shard: true
  allow_limited_proxy_importance_generation: true
  allow_tiny_world_model_training: true
  no_videomae_training: true
  no_teacher_training: true
  no_selector_training: true
  no_current_importance_training: true
  no_action_input: true
  no_vlm: true
  no_rl: true
  no_large_token_shards: true
  no_large_importance_shards: true
  no_write_data_token_shards: true
  no_write_data_importance_shards: true
  keep_tensorflow_out_of_env_isaaclab: true

