stage: train_selector_bair_videomae_500_64_weighted_mse
project_root: /home/ubuntu22/tgpawb_world_model
seed: 42

data:
  dataset: BAIR
  train_token_shard_dir: /home/ubuntu22/tgpawb_world_model/data/token_shards/bair_videomae_500_64/train
  test_token_shard_dir: /home/ubuntu22/tgpawb_world_model/data/token_shards/bair_videomae_500_64/test
  train_importance_shard_dir: /home/ubuntu22/tgpawb_world_model/data/importance_shards/bair_videomae_teacher_500_64/train
  test_importance_shard_dir: /home/ubuntu22/tgpawb_world_model/data/importance_shards/bair_videomae_teacher_500_64/test
  token_shard_glob: tokens_shard_*.pt
  importance_shard_glob: importance_shard_*.pt
  split_train: train
  split_test: test
  require_key_token_mask: false
  max_train_samples: 500
  max_test_samples: 64

selector_model:
  token_dim: 768
  hidden_dim: 256
  dropout: 0.0
  use_task: false

selection:
  topk: 16
  use_sigmoid_scores: true

selector_training:
  device: cuda_if_available
  batch_size: 4
  max_steps: 800
  learning_rate: 0.001
  weight_decay: 0.0001
  num_workers: 0
  log_every: 100
  checkpoint_every: 800
  max_grad_norm: 1.0

loss_variants:
  - name: weighted_mse_alpha2
    type: weighted_mse
    seed: 0
    alpha: 2.0
    topk: 16

resource_limits:
  max_ram_gb_warning: 28
  max_gpu_mem_fraction_warning: 0.9
  cloud_recommendation_on_oom: true

output:
  run_root: /home/ubuntu22/tgpawb_world_model/runs
  run_name: student_selector_bair_videomae_500_64_weighted_mse_v1
  save_checkpoint: true
  save_metrics: true
