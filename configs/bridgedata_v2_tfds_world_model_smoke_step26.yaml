  step25_run_dir: /home/ubuntu22/tgpawb_world_model/runs/bridgedata_v2_tfds_importance_step25_v1
  importance_manifest_jsonl: /home/ubuntu22/tgpawb_world_model/runs/bridgedata_v2_tfds_importance_step25_v1/tfds_importance_smoke_manifest.jsonl
  importance_summary_json: /home/ubuntu22/tgpawb_world_model/runs/bridgedata_v2_tfds_importance_step25_v1/tfds_importance_summary.json
  importance_smoke_dir: /home/ubuntu22/tgpawb_world_model/runs/bridgedata_v2_tfds_importance_step25_v1/importance_smoke

sample_limits:
  max_samples: 4
  batch_size: 1

token_shapes:
  context: [16, 392, 768]
  current: [4, 392, 768]
  future: [4, 392, 768]
  context_importance: [16, 392]

context_bottleneck:
  current_tokens_kept_full: true
  train_current_importance: false
  context_tokens_only: true
  topk_values: [64, 128, 256]
  default_topk: 256
  retention_ratio_reference: 0.04081632653061224

policies:
  - name: current_only
    use_context: false
    topk: 0
  - name: random_context_topk
    use_context: true
    selection: random
    topk: 256
    seed: 42
  - name: proxy_importance_topk
    use_context: true
    selection: importance_topk
    topk: 256
  - name: full_context_reference
    use_context: true
    selection: full
    topk: null
    deployable: false

world_model_smoke:
  mode: forward_loss_only
  no_optimizer_step: true
  no_training: true
  model_type: smoke_context_bottleneck_predictor
  prediction_target: future_token_summary
  input_current_summary: mean_pool_full_current
  input_context_summary: mean_pool_selected_context
  loss: mse_to_future_summary
  hidden_dim: 512
  eval_mode: true
  freeze_if_existing_model: true
  allow_random_init_for_smoke: true
  random_init_result_not_scientific: true

metrics:
  compute_finite_loss: true
  compute_policy_loss_table: true
  compute_selected_importance_mass: true
  compute_temporal_selected_histogram: true
  compute_shape_summary: true

guards:
  no_download: true
  no_new_data_download: true
  no_new_tfds_shard_download: true
  no_model_download: true
  no_token_extraction: true
  no_importance_generation: true
  no_training: true
  no_optimizer_step: true
  no_teacher_training: true
  no_selector_training: true
  no_world_model_training: true
  no_large_token_shards: true
  no_large_importance_shards: true
  no_write_data_token_shards: true
  no_write_data_importance_shards: true
  no_current_importance: true
  no_action_input: true
  no_vlm: true
  no_rl: true
  keep_tensorflow_out_of_env_isaaclab: true

output:
